<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>

  <body>
    <div class="container">
      <h2>Login</h2>
      <div id="login-message" style="display: none; color: red; text-align: center; margin-bottom: 10px"></div>
      <form id="loginForm">
        <input type="text" id="username" placeholder="Username" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>

      <p>
        Don't have an account?
        <a href="register">Register</a>
      </p>

      <div style="margin-top: 15px; font-size: 14px; color: #333; background-color: #f9f9f9; padding: 10px; border-radius: 5px">
        <p><strong>Test Accounts:</strong></p>
        <ul style="list-style: none; padding-left: 0; margin: 0">
          <li>
            <strong>Test Customer</strong>
            → Username:
            <strong>customer1</strong>
            , Password:
            <strong>123456</strong>
          </li>
          <li>
            <strong>Test Admin</strong>
            → Username:
            <strong>admin1</strong>
            , Password:
            <strong>adminpass</strong>
          </li>
        </ul>
      </div>
    </div>

    <script src="../assets/js/main.js"></script>
  </body>
</html>
