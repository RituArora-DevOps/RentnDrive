<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Search Results</title>
    <link rel="stylesheet" href="../assets/css/search_results.css" />
  </head>
  <body>
    <!-- Fixed Header -->
    <header>
      <div class="logo" onclick="window.location.href='/'">RentNDrive</div>
      <div class="auth-buttons">
        <button class="register-btn" onclick="window.location.href='/register'">Register</button>
        <button class="login-btn" onclick="window.location.href='/login'">Login</button>
      </div>
    </header>

    <!-- Fixed Filter Form -->
    <section class="filters">
      <form id="filters-form">
        <div class="filter-group">
          <label for="start-date">Start Date:</label>
          <input type="date" id="start-date" name="start" />
        </div>
        <div class="filter-group">
          <label for="end-date">End Date:</label>
          <input type="date" id="end-date" name="end" />
        </div>
        <div class="filter-group">
          <label for="make-filter">Make:</label>
          <select id="make-filter" name="make">
            <option value="">--Select Make--</option>
            <!-- Options will be dynamically loaded -->
          </select>
        </div>
        <div class="filter-group">
          <label for="type-filter">Type:</label>
          <select id="type-filter" name="type">
            <option value="">--Select Type--</option>
            <!-- Options will be dynamically loaded -->
          </select>
        </div>
        <div class="filter-group">
          <label for="year-filter">Year:</label>
          <select id="year-filter" name="year">
            <option value="">--Select Year--</option>
            <!-- Options will be dynamically loaded -->
          </select>
        </div>
        <div class="filter-group">
          <label for="minPrice-filter">Min Price:</label>
          <input type="number" step="0.01" id="minPrice-filter" name="minPrice" placeholder="e.g., 50" />
        </div>
        <div class="filter-group">
          <label for="maxPrice-filter">Max Price:</label>
          <input type="number" step="0.01" id="maxPrice-filter" name="maxPrice" placeholder="e.g., 100" />
        </div>
        <div class="filter-actions">
          <button type="submit">Apply Filters</button>
          <button type="reset" id="reset-all">Reset All</button>
        </div>
      </form>
    </section>

    <!-- Scrollable Car Results Container -->
    <section id="car-results">
      <div id="car-list"></div>
    </section>

    <!-- Fixed Footer -->
    <footer>
      <p>© 2025 All rights reserved</p>
      <div class="social-icons">
        <img src="../assets/images/facebook.png" alt="Facebook" />
        <img src="../assets/images/x.png" alt="X" />
        <img src="../assets/images/instagram.png" alt="Instagram" />
      </div>
    </footer>

    <script src="../assets/js/search_results.js"></script>
  </body>
</html>
