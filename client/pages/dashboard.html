<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Car Rental</title>
  <link rel="stylesheet" href="dashboard_styles.css">
  <script defer src="dashboard_script.js"></script>
</head>

<body>

  <!-- Header -->
  <header>
    <div class="logo">RentNDrive</div>
    <button class="register-btn">My Account</button>
  </header>

  <!-- Main Section -->
  <main>
    <!-- Hero Section -->
    <section class="hero">
      <div class="hero-content">
        <div class="search-box">
          <label>
            <span>Start Date</span>
            <input type="date" id="start-date">
          </label>
          <label>
            <span>End Date</span>
            <input type="date" id="end-date">
          </label>
          <button class="search-btn">🔍</button>
        </div>
      </div>
    </section>

    <!-- Car Grid -->
    <section class="car-grid">
      <div class="car-images">
        <div class="car-item">Cars</div>
        <div class="car-item">SUVs</div>
        <div class="car-item">Minivans</div>
        <div class="car-item">Trucks</div>
        <div class="car-item">Vans</div>
        <div class="car-item">Boxtrucks</div>
      </div>
      <div class="car-text">
        <h2>Car rental for any occasion</h2>
        <p>Browse an incredible selection of cars, from the everyday to the extraordinary.</p>
        <button class="explore-btn">Explore cars</button>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>© 2025 All rights reserved</p>
    <div class="social-icons">
      <img src="../assets/images/facebook.png" alt="F">
      <img src="../assets/images/x.png" alt="X">
      <img src="../assets/images/instagram.png" alt="I">
    </div>
  </footer>

</body>

</html>
