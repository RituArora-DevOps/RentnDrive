<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Booking Page</title>
</head>
<body>
  <h1>Booking Page</h1>
  <div id="car-details"></div>

  <label>Start Date: <input type="date" id="start-date"></label>
  <label>End Date: <input type="date" id="end-date"></label>
  <label>Extra: <input type="text" id="extra"></label>

  <button id="proceed-payment">Proceed to Payment</button>

  <script>
    // 1) Parse the carId from the current URL
    //    The URL is /booking/:carId. E.g. /booking/123
    const pathParts = window.location.pathname.split('/');
    const carId = pathParts[2]; // "123"

    // 2) Fetch car data from your API
    fetch(`/api/car/cars/${carId}`)
      .then(res => res.json())
      .then(car => {
        const detailsDiv = document.getElementById("car-details");
        detailsDiv.innerHTML = `
          <p><strong>Make:</strong> ${car.make}</p>
          <p><strong>Model:</strong> ${car.model}</p>
          <p><strong>Year:</strong> ${car.year}</p>
          <p><strong>Price per day:</strong> $${car.price_per_day}</p>
          <img src="${car.image_url || '../assets/images/default-car.jpg'}" alt="${car.make} ${car.model}" width="300">
        `;
      })
      .catch(err => console.error(err));

    // 3) On click "Proceed to Payment"
    document.getElementById('proceed-payment').addEventListener('click', () => {
      const start = document.getElementById('start-date').value;
      const end   = document.getElementById('end-date').value;
      const extra = document.getElementById('extra').value;

      // Validate date, etc. as needed
      if (!start || !end || new Date(start) >= new Date(end)) {
        alert("Please select a valid date range");
        return;
      }

      // 4) Redirect to /booking-payment with query params
      //    e.g. /booking-payment?carId=123&start=2025-03-01&end=2025-03-05&extra=...
      const params = new URLSearchParams({
        carId,
        start,
        end,
        extra
      });
      window.location.href = `/booking-payment?${params.toString()}`;
    });
  </script>
</body>
</html>
